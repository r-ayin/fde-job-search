<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>mock search</title>
<style>
  body { font-family: system-ui, sans-serif; margin: 0; padding: 16px; background: #f5f6f8; }
  ul { list-style: none; padding: 0; margin: 0; }
  li.job-card-box { background: #fff; border: 1px solid #e6e7eb; border-radius: 10px;
                    padding: 16px; margin-bottom: 14px; }
  a.job-name { font-size: 19px; font-weight: 700; color: #222; text-decoration: none; display: block; }
  .job-salary { color: #fe5746; font-weight: 700; font-size: 18px; float: right; }
  .company-name { color: #61666d; font-size: 14px; margin-top: 6px; }
  .company-location { color: #9aa0a6; font-size: 13px; }
  .tag-list { margin-top: 8px; }
  .tag-list li { display: inline-block; background: #f0f1f3; color: #61666d;
                 border-radius: 4px; padding: 2px 8px; margin-right: 6px; font-size: 12px; }
  .btn-chat { background: #00bebd; color: #fff; border: 0; border-radius: 6px;
              padding: 8px 18px; font-size: 14px; cursor: pointer; margin-top: 10px; }
  #log { white-space: pre-wrap; font-family: monospace; font-size: 12px; background: #111;
         color: #0f0; padding: 10px; margin-top: 16px; max-height: 200px; overflow: auto; }
</style>
</head>
<body>
<ul>
  <li class="job-card-box">
    <span class="job-salary">15-25K</span>
    <a class="job-name" href="/job_detail/eidAAA111.html">FDE（AI 交付工程师）</a>
    <div class="company-name">南通五棵葱文化传媒</div>
    <div class="company-location">杭州 3-5年 本科</div>
    <ul class="tag-list"><li>Python</li><li>LangChain</li><li>Docker</li></ul>
    <button class="btn-chat">立即沟通</button>
  </li>
  <li class="job-card-box">
    <span class="job-salary">18-30K·13薪</span>
    <a class="job-name" href="/job_detail/eidBBB222.html">前沿部署工程师（FDE）</a>
    <div class="company-name">云智创心科技</div>
    <div class="company-location">杭州 1-3年 本科</div>
    <ul class="tag-list"><li>RAG</li><li>MCP</li></ul>
    <button class="btn-chat">立即沟通</button>
  </li>
  <li class="job-card-box">
    <span class="job-salary">12-18K·13薪</span>
    <a class="job-name" href="/job_detail/eidCCC333.html">FDE前向部署工程师</a>
    <div class="company-name">杭州雾楼台</div>
    <div class="company-location">杭州 经验不限</div>
    <ul class="tag-list"><li>AI Agent</li></ul>
    <button class="btn-chat">继续沟通</button>
  </li>
</ul>
<pre id="log"></pre>
<script>
const L = [];
['pointerdown','mousedown','pointerup','mouseup','click'].forEach(t =>
  document.addEventListener(t, e => {
    L.push({ t, trusted: e.isTrusted, target: (e.target.className || e.target.tagName) });
    document.getElementById('log').textContent = JSON.stringify(L.slice(-30), null, 1);
  }, true));
window.__log = () => L;
window.__clear = () => { L.length = 0; document.getElementById('log').textContent = ''; };
</script>
</body>
</html>
